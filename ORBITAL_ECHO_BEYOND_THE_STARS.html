<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ORBITAL ECHO: BEYOND THE STARS</title><style>
:root{color-scheme:dark;--c:#4df3ff;--o:#ff9a3c;--f:#e8f6ff;--p:rgba(8,14,36,.78);--u:1;--sl:max(12px,env(safe-area-inset-left,0px));--sr:max(12px,env(safe-area-inset-right,0px));--st:max(10px,env(safe-area-inset-top,0px));--sb:max(16px,env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05080f;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--f);touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
.hud{position:absolute;left:var(--sl);top:var(--st);right:var(--sr);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:8px 0}
.panel{background:var(--p);backdrop-filter:blur(12px);border:1px solid rgba(77,243,255,.25);border-radius:14px;padding:10px 14px;min-width:120px}
.title{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:4px}
.val{font-size:22px;font-weight:700;color:var(--c)}
#msg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;max-width:90%;pointer-events:none}
#msg h1{font-size:clamp(28px,6vw,48px);margin-bottom:8px;text-shadow:0 0 24px rgba(77,243,255,.5)}
#msg p{opacity:.85;font-size:15px;line-height:1.4}
#startBtn,#retryBtn{pointer-events:auto;margin-top:18px;background:linear-gradient(135deg,#4df3ff,#2bb8ff);color:#041018;border:none;border-radius:999px;padding:14px 28px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(77,243,255,.35)}
#startBtn:active,#retryBtn:active{transform:scale(.97)}
#controls{position:absolute;bottom:calc(var(--sb)+12px);left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center}
.btn{width:64px;height:64px;border-radius:50%;background:rgba(8,14,36,.75);border:2px solid rgba(77,243,255,.4);display:flex;align-items:center;justify-content:center;font-size:22px;pointer-events:auto;backdrop-filter:blur(8px)}
.btn:active{background:rgba(77,243,255,.25)}
#fire{width:76px;height:76px;background:linear-gradient(135deg,rgba(255,154,60,.9),rgba(255,90,40,.85));border-color:rgba(255,154,60,.6)}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="hud">
    <div class="panel"><div class="title">Score</div><div class="val" id="score">0</div></div>
    <div class="panel"><div class="title">Shield</div><div class="val" id="shield">100</div></div>
  </div>
  <div id="msg">
    <h1>ORBITAL ECHO</h1>
    <p>BEYOND THE STARS<br>Sopravvivi nello spazio, distruggi asteroidi e nemici.</p>
    <button id="startBtn">INIZIA</button>
  </div>
  <div id="controls" style="display:none">
    <div class="btn" id="left">◀</div>
    <div class="btn" id="fire">🔥</div>
    <div class="btn" id="right">▶</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Simplified placeholder - full game code was previously generated */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05080f);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
camera.position.z=8;
let score=0,shield=100,running=false;
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
document.getElementById('startBtn').onclick=()=>{document.getElementById('msg').style.display='none';document.getElementById('controls').style.display='flex';running=true};
function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}
animate();
</script></body></html>
